<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SettleMatch</title>
    <meta name="description" content="Reconcile Shopify orders, Razorpay settlements and your bank statement. Every gap found, sized and explained." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23121210'/><text x='16' y='23' font-size='19' text-anchor='middle' fill='%23f0efea' font-family='monospace'>₹</text></svg>" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#121210" />
    <!-- Apply a stored theme before first paint. Same key as maushook.com; src/theme.ts runs the toggle. -->
    <script>try{var t=localStorage.getItem('maushook-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
