# Tests every push to main, then deploys the Worker to maushook.com/settlematch.
# Needs the repo secret CLOUDFLARE_API_TOKEN and the repo variable CLOUDFLARE_ACCOUNT_ID.
name: Test and deploy

on:
  push:
    branches: [main]

# One deploy at a time; a newer push waits instead of racing an older one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # npm run deploy type-checks, builds dist/ and runs wrangler deploy.
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
